name: Deploy Web Dinamis to AWS EC2

on:
  push:
    branches: [ main ]
    paths:
      - 'web-dinamis/**'
      - '.github/workflows/deploy-web-dinamis.yml'
  workflow_dispatch:

jobs:
  build-and-deploy-web-dinamis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./web-dinamis
          file: ./web-dinamis/Dockerfile
          push: true
          no-cache: true
          # ✅ Nama image disesuaikan dengan docker-compose.yml
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/web-dinamis:latest

  deploy-to-ec2:
    runs-on: ubuntu-latest
    needs: build-and-deploy-web-dinamis
    steps:
      - name: Deploy Web Dinamis via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 10m
          script: |
            # Cari repositori git yang benar berdasarkan remote URL
            PROJECT_ROOT=""
            ORIG_PWD=$(pwd)
            for git_dir in $(find /home/ubuntu -name ".git" -type d 2>/dev/null); do
              repo_dir=$(dirname "$git_dir")
              cd "$repo_dir" 2>/dev/null && {
                remote_url=$(git remote get-url origin 2>/dev/null)
                if [[ "$remote_url" == *"UAS_2388010031_Eka"* || "$remote_url" == *"UAS_EKA"* ]]; then
                  PROJECT_ROOT="$repo_dir"
                  break
                fi
              }
            done

            if [ -z "$PROJECT_ROOT" ]; then
              cd "$ORIG_PWD" 2>/dev/null
              for git_dir in $(find /home -name ".git" -type d 2>/dev/null); do
                repo_dir=$(dirname "$git_dir")
                cd "$repo_dir" 2>/dev/null && {
                  remote_url=$(git remote get-url origin 2>/dev/null)
                  if [[ "$remote_url" == *"UAS_2388010031_Eka"* || "$remote_url" == *"UAS_EKA"* ]]; then
                    PROJECT_ROOT="$repo_dir"
                    break
                  fi
                }
              done
            fi

            cd "$ORIG_PWD" 2>/dev/null

            if [ -n "$PROJECT_ROOT" ]; then
              cd "$PROJECT_ROOT"
              echo "Found correct Git repository at: $(pwd)"
              git fetch origin main
              git reset --hard origin/main
            else
              echo "Git repository not found. Cloning new repository..."
              git clone https://github.com/ekatiara05/UAS_2388010031_Eka.git /home/ubuntu/UAS_2388010031_Eka
              cd /home/ubuntu/UAS_2388010031_Eka
            fi

            # Cari docker-compose.yml setelah repository terupdate/terklon
            COMPOSE_PATH=$(find . -name "docker-compose.yml" 2>/dev/null | head -n 1)
            if [ -n "$COMPOSE_PATH" ]; then
              cd $(dirname "$COMPOSE_PATH")
              echo "Deploying in directory: $(pwd)"
            else
              echo "Error: docker-compose.yml not found after update"
              exit 1
            fi

            # ✅ Pull image dengan nama yang benar
            sudo docker pull ekatiara/web-dinamis:latest

            # ✅ Fix: hapus spasi di sekitar tanda =
            sudo DOCKERHUB_USERNAME=ekatiara docker compose up -d --force-recreate --no-deps container-dinamis

            # Bersihkan image lama
            sudo docker image prune -af

            # ✅ Fix: nama database dan file SQL disesuaikan dengan docker-compose.yml
            echo "Resetting and importing database on EC2..."
            sudo docker compose exec -T db-webdinamis mysql -u root -p'password!123' \
              -e "DROP DATABASE IF EXISTS dbcompro; CREATE DATABASE dbcompro;"
            sudo docker compose exec -T db-webdinamis mysql -u root -p'password!123' \
              dbcompro < db_data/dbcompro.sql

            echo "=== Status ==="
            sudo docker ps